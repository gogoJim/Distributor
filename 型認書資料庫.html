    <script>
        (function() {
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });
            function blockDevTools(e) {
                if (e.key === 'F12') {
                    e.preventDefault();
                    return false;
                }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'i')) {
                    e.preventDefault();
                    return false;
                }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'J' || e.key === 'j')) {
                    e.preventDefault();
                    return false;
                }
                if ((e.ctrlKey || e.metaKey) && (e.key === 'U' || e.key === 'u')) {
                    e.preventDefault();
                    return false;
                }
                if ((e.ctrlKey || e.metaKey) && (e.key === 'S' || e.key === 's')) {
                    e.preventDefault();
                    return false;
                }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'C' || e.key === 'c')) {
                    e.preventDefault();
                    return false;
                }
                return true;
            }
            document.addEventListener('keydown', blockDevTools);
            let devtoolsOpen = false;
            const element = new Image();
            Object.defineProperty(element, 'id', {
                get: function() {
                    devtoolsOpen = true;
                    console.warn('偵測到開發者工具');
                    return '';
                }
            });
            setInterval(function() {
                devtoolsOpen = false;
                console.log(element);
                console.clear();
                if (devtoolsOpen) {
                    console.clear();
                }
            }, 1000);
        })();
    </script>
    <!-- ========== 防護區塊結束 ========== -->

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function openApprovalPDF(idValue) {

        window.open(htmlPath, '_blank');

    function getSelectedIdsFromStorage() {
        const stored = localStorage.getItem('typeAccept_selected_ids');
        if (stored) {
            try {
                return JSON.parse(stored);
            } catch(e) {
                return [];
            }
        }
        return [];
    }

    function getCurrentDisplayDevices() {
        const selectedIds = getSelectedIdsFromStorage();
        const hasSelection = selectedIds.length > 0;
        const devices = [];
        for (let item of deviceData) {
            const shouldShow = !hasSelection || (item.id !== "-" && selectedIds.includes(item.id));
            if (shouldShow) {
                devices.push(item);
            }
        }
        return { devices, selectedIds, hasSelection };
    }

    // 一鍵下載功能：使用 fetch + JSZip 打包下載（需 HTTP 伺服器）
    // 注意：此功能需要在 HTTP/HTTPS 協議下執行，file:// 協議會因 CORS 失敗
    async function downloadAllApprovalPDFs() {
        const { devices, selectedIds, hasSelection } = getCurrentDisplayDevices();
        
        if (!hasSelection || devices.length === 0) {
            alert("目前無篩選條件，請先至「型式認可清冊」勾選設備後，再使用一鍵下載功能。");
            return;
        }
        
        const validDevices = devices.filter(item => item.id && item.id !== "-");
        
        if (validDevices.length === 0) {
            alert("目前篩選的設備中，沒有有效的識別碼 (ID)，無法下載。");
            return;
        }
        
        progressDiv.style.display = "block";
        progressDiv.innerHTML = `⏳ 正在準備下載 ${validDevices.length} 個檔案，請稍候...`;
        downloadBtn.disabled = true;
        downloadBtn.classList.add('disabled');
        
        try {
            const zip = new JSZip();
            let successCount = 0;
            let failCount = 0;
            
            // 檢查是否為 file:// 協議，若是則提示改用 HTTP 伺服器
            if (window.location.protocol === 'file:') {
                progressDiv.innerHTML = `⚠️ 偵測到 file:// 協議，無法打包下載！<br>請使用 HTTP 伺服器（如 Live Server）開啟此頁面。<br>目前改為直接開啟 PDF 檔案...`;
                setTimeout(() => {
                    // 改為直接開啟
                    for (let i = 0; i < validDevices.length; i++) {
                        const item = validDevices[i];
                        setTimeout(() => {
                            window.open(`認可書/${item.id}.pdf`, '_blank');
                        }, i * 300);
                    }
                    progressDiv.innerHTML = `✅ 已開啟 ${validDevices.length} 個 PDF 檔案（瀏覽器可能阻擋彈窗）`;
                    setTimeout(() => {
                        progressDiv.style.display = "none";
                    }, 4000);
                }, 1500);
                downloadBtn.disabled = false;
                downloadBtn.classList.remove('disabled');
                return;
            }
            
            // HTTP/HTTPS 協議下使用 fetch 打包
            const fetchPromises = validDevices.map(async (item) => {
                const pdfUrl = `認可書/${item.id}.pdf`;
                try {
                    const response = await fetch(pdfUrl);
                    if (response.ok) {
                        const blob = await response.blob();
                        const fileName = `${String(item.sn).padStart(3,'0')}_${item.id}_${item.deviceName}.pdf`;
                        zip.file(fileName, blob);
                        successCount++;
                        progressDiv.innerHTML = `⏳ 正在打包... (${successCount + failCount}/${validDevices.length})`;
                        return true;
                    } else {
                        console.warn(`檔案不存在: ${pdfUrl}`);
                        failCount++;
                        return false;
                    }
                } catch (error) {
                    console.error(`下載失敗: ${pdfUrl}`, error);
                    failCount++;
                    return false;
                }
            });
            
            await Promise.all(fetchPromises);
            
            if (successCount === 0) {
                alert("所有認可書檔案都不存在，請確認「認可書」資料夾內有對應的 PDF 檔案。");
                progressDiv.style.display = "none";
                downloadBtn.disabled = false;
                downloadBtn.classList.remove('disabled');
                return;
            }
            
            progressDiv.innerHTML = `📦 正在產生壓縮檔... (成功: ${successCount}, 失敗: ${failCount})`;
            
            const content = await zip.generateAsync({ type: "blob" });
            const link = document.createElement('a');
            const url = URL.createObjectURL(content);
            link.href = url;
            const timestamp = new Date().toISOString().slice(0,19).replace(/:/g, '-');
            link.download = `認可書_${selectedIds.length}筆_${timestamp}.zip`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            
            progressDiv.innerHTML = `✅ 下載完成！成功下載 ${successCount} 個檔案`;
            setTimeout(() => {
                progressDiv.style.display = "none";
            }, 3000);
            
        } catch (error) {
            console.error("打包下載失敗:", error);
            alert("打包下載失敗，請檢查網路連線後重試。");
            progressDiv.style.display = "none";
        } finally {
            downloadBtn.disabled = false;
            downloadBtn.classList.remove('disabled');
        }
    }

    function approvalHandler(e) {
        const btn = e.currentTarget;
        const idValue = btn.getAttribute('data-id');
        openApprovalPDF(idValue);
    }

    function labelHandler(e) {
        const btn = e.currentTarget;
        const idValue = btn.getAttribute('data-id');
        openLabelHTML(idValue);
    }

    function updateDisplayCount(displayCount, selectedCount) {
        const existingHint = document.getElementById('syncHint');
        if (existingHint) existingHint.remove();
        
        const hintDiv = document.createElement('div');
        hintDiv.id = 'syncHint';
        hintDiv.style.cssText = 'background:#e8f5e9; padding:8px 15px; border-radius:20px; margin-bottom:15px; font-size:13px; color:#2e7d32; display:inline-block; width:auto;';
        
        if (selectedCount > 0) {
            hintDiv.innerHTML = `🔗 同步模式：已從「型式認可清冊」同步 ${selectedCount} 筆勾選設備，目前顯示 ${displayCount} 筆 | <a href="#" id="clearSyncBtn" style="color:#c0392b;">清除同步條件</a>`;
            downloadBtn.style.display = "inline-flex";
        } else {
            hintDiv.innerHTML = `📋 一般模式：顯示全部 ${displayCount} 筆設備 | 請至「型式認可清冊」勾選設備後即可同步篩選`;
            downloadBtn.style.display = "none";
        }
        
        const title = document.querySelector('h2');
        title.insertAdjacentElement('afterend', hintDiv);
        
        const clearBtn = document.getElementById('clearSyncBtn');
        if (clearBtn) {
            clearBtn.addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.removeItem('typeAccept_selected_ids');
                renderTable();
            });
        }
    }

    function renderTable() {
        const selectedIds = getSelectedIdsFromStorage();
        const hasSelection = selectedIds.length > 0;
        
        let html = '';
        let displayCount = 0;
        
        for (let item of deviceData) {
            const shouldShow = !hasSelection || (item.id !== "-" && selectedIds.includes(item.id));
            if (!shouldShow) continue;
            
            displayCount++;
            const hasValidId = (item.id && item.id !== "-");
            
            const approvalBtn = hasValidId 
                ? `<button class="pdf-btn" data-id="${item.id}" data-type="approval">📄 認可書</button>`
                : `<button class="pdf-btn" disabled style="background:#aaa; cursor:not-allowed;">📄 認可書</button>`;
            
            const labelBtn = hasValidId
                ? `<button class="pdf-btn label-btn" data-id="${item.id}" data-type="label">🏷️ 標籤</button>`
                : `<button class="pdf-btn label-btn" disabled style="background:#aaa; cursor:not-allowed;">🏷️ 標籤</button>`;

            html += `
                <tr>
                    <td>${item.sn}</td>
                    <td>${item.id === "-" ? "—" : item.id}</td>
                    <td>${escapeHtml(item.certNo)}</td>
                    <td>${escapeHtml(item.deviceName)}</td>
                    <td>${escapeHtml(item.model)}</td>
                    <td class="btn-group">${approvalBtn} ${labelBtn}</td>
                </tr>
            `;
        }
        
        if (displayCount === 0 && hasSelection) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px;">⚠️ 目前勾選的設備無效 ID 或不存在，請重新勾選</td></tr>`;
        } else if (displayCount === 0 && !hasSelection) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px;">📋 目前無設備資料</td></tr>`;
        } else {
            tbody.innerHTML = html;
        }
        
        const allApprovalBtns = document.querySelectorAll('.pdf-btn[data-type="approval"]');
        const allLabelBtns = document.querySelectorAll('.pdf-btn[data-type="label"]');
        
        allApprovalBtns.forEach(btn => {
            if (!btn.disabled) {
                btn.removeEventListener('click', approvalHandler);
                btn.addEventListener('click', approvalHandler);
            }
        });
        
        allLabelBtns.forEach(btn => {
            if (!btn.disabled) {
                btn.removeEventListener('click', labelHandler);
                btn.addEventListener('click', labelHandler);
            }
        });
        
        updateDisplayCount(displayCount, selectedIds.length);
    }

    window.addEventListener('storage', (e) => {
        if (e.key === 'typeAccept_selected_ids') {
            console.log('🔄 偵測到勾選清單變更，重新整理表格');
            renderTable();
        }
    });

    downloadBtn.addEventListener('click', downloadAllApprovalPDFs);

    renderTable();

    let lastIdsLength = getSelectedIdsFromStorage().length;
    setInterval(() => {
        const currentLength = getSelectedIdsFromStorage().length;
        if (currentLength !== lastIdsLength) {
            lastIdsLength = currentLength;
            renderTable();
        }
    }, 2000);
</script>
</body>
</html>
