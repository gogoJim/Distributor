    body {

    .container {

        margin: 0 auto;

        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        padding: 20px;
        overflow-x: auto;

    .header-area {
        display: flex;
        justify-content: space-between;
        align-items: center;

    h2 {
        color: #1e466e;

    .btn-download {
        background: #2c7da0;
        color: white;
        border: none;
        padding: 8px 20px;
        border-radius: 40px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .btn-download:hover {
        background: #1f5e7a;
        transform: translateY(-1px);
    }
    .btn-download.disabled {
        background: #b0bed0;
        cursor: not-allowed;
        transform: none;
    }
    table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13.5px;
        min-width: 800px;
    }
    th, td {
        border: 1px solid #9aaebf;
        padding: 8px 6px;
        text-align: center;
        vertical-align: middle;
    }
    th {
        background-color: #eef3fc;
        font-weight: 700;
    }

    #mainTable tbody tr:hover {
        background-color: #e6f3ff !important;
        cursor: pointer;
        transition: background-color 0.15s ease;
    }

    #mainTable tbody tr:hover td {
        background-color: #d4e8ff;
        transition: background-color 0.15s ease;
    }

    .btn-group {
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
    }
    .pdf-btn {
        background: #2c7da0;
        border: none;
        color: white;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 12px;
        cursor: pointer;
        font-weight: 500;
        transition: 0.2s;
        text-decoration: none;
        display: inline-block;
    }
    .pdf-btn:hover {
        background: #1f5e7a;
        transform: translateY(-1px);
    }
    .pdf-btn.label-btn {
        background: #27ae60;
    }
    .pdf-btn.label-btn:hover {
        background: #1e8449;
    }
    .footer-info {
        margin-top: 18px;
        font-size: 12px;
        color: #2c5a74;
        text-align: right;
        border-top: 1px dashed #cbdae6;
        padding-top: 12px;
    }
    @media (max-width: 750px) {
        th, td { font-size: 11px; padding: 4px; }
        .pdf-btn { padding: 3px 8px; font-size: 10px; }
        .btn-download { padding: 6px 12px; font-size: 12px; }
    }
    .download-progress {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #1e466e;
        color: white;
        padding: 12px 20px;
        border-radius: 30px;
        font-size: 13px;
        z-index: 1000;
        box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        display: none;
        max-width: 350px;
        word-break: break-word;
        text-align: center;
        font-weight: 500;
    }
</style>

</head>
<body>
<div class="container">
    <div class="header-area">
        <h2>📋 消防安全設備合併總表（含認可書／標籤連結）</h2>
        <button class="btn-download" id="oneClickDownloadBtn">📥 一鍵下載 (認可書 PDF)</button>
    </div>

    <table id="mainTable">
        <thead>
            <tr>
                <th>序號</th>
                <th>識別碼 (ID)</th>
                <th>認可編號 / 案號</th>
                <th>設備名稱</th>
                <th>型號</th>
                <th>文件連結</th>
             </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
     </table>
    <div class="footer-info">
        ✅ 按鈕說明：📄「認可書」→ 對應 <strong>PDF2/</strong> 資料夾內 [ID].pdf  <br>
        🏷️「標籤」→ 對應 <strong>sticker/</strong> 資料夾內 [ID].html <br>
        📥「一鍵下載」→ 將所有勾選設備的認可書 PDF 打包下載為 ZIP 檔<br>
        🔍 若檔案不存在，會自動跳過並顯示失敗數量
    </div>
</div>

<div class="download-progress" id="downloadProgress">
    ⏳ 準備下載...
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<!-- 👇 引入共用資料檔 -->
<script src="device-data.js"></script>
<script>
    // ✅ 使用共用資料（序號不再儲存於資料中，改由渲染時動態產生）
    const deviceData = DEVICE_DATA;

    const tbody = document.getElementById('tableBody');
    const downloadBtn = document.getElementById('oneClickDownloadBtn');
    const progressDiv = document.getElementById('downloadProgress');

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function openApprovalPDF(idValue) {
        if (!idValue || idValue === "-") {
            alert("此設備無對應識別碼 (ID)，無法開啟認可書。");
            return;
        }
        const pdfPath = `PDF2/${idValue}.pdf`;
        window.open(pdfPath, '_blank');
    }

    function openLabelHTML(idValue) {
        if (!idValue || idValue === "-") {
            alert("此設備無對應識別碼 (ID)，無法開啟標籤文件。");
            return;
        }
        const htmlPath = `sticker/${idValue}.html`;
        window.open(htmlPath, '_blank');
    }

    function getSelectedIdsFromStorage() {
        const stored = localStorage.getItem('typeAccept_selected_ids');
        if (stored) {
            try {
                const parsed = JSON.parse(stored);
                if (Array.isArray(parsed)) return parsed;
            } catch(e) {}
        }
        return [];
    }

    function renderTable() {
        const selectedIds = getSelectedIdsFromStorage();
        const hasSelection = selectedIds.length > 0;

        let html = '';
        let displayCount = 0;

        // ✅ 使用索引迴圈，序號 = 原始資料位置 + 1
        for (let idx = 0; idx < deviceData.length; idx++) {
            const item = deviceData[idx];
            const shouldShow = !hasSelection || (item.id !== "-" && selectedIds.includes(item.id));
            if (!shouldShow) continue;

            displayCount++;
            const displaySn = idx + 1;
            const hasValidId = (item.id && item.id !== "-");

            const approvalBtn = hasValidId
                ? `<button class="pdf-btn" data-id="${item.id}" data-type="approval">📄 認可書</button>`
                : `<button class="pdf-btn" disabled style="background:#aaa; cursor:not-allowed;">📄 認可書</button>`;

            const labelBtn = hasValidId
                ? `<button class="pdf-btn label-btn" data-id="${item.id}" data-type="label">🏷️ 標籤</button>`
                : `<button class="pdf-btn label-btn" disabled style="background:#aaa; cursor:not-allowed;">🏷️ 標籤</button>`;

            html += `
                <tr>
                    <td>${displaySn}</td>
                    <td>${item.id === "-" ? "—" : item.id}</td>
                    <td>${escapeHtml(item.certNo)}</td>
                    <td>${escapeHtml(item.deviceName)}</td>
                    <td>${escapeHtml(item.model)}</td>
                    <td class="btn-group">${approvalBtn} ${labelBtn}</td>
                 </tr>
            `;
        }

        if (displayCount === 0 && hasSelection) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px;">⚠️ 目前勾選的設備無效 ID 或不存在，請重新勾選</td></tr>`;
            downloadBtn.style.display = "none";
        } else if (displayCount === 0 && !hasSelection) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px;">📋 目前無設備資料</td></tr>`;
            downloadBtn.style.display = "none";
        } else {
            tbody.innerHTML = html;
            downloadBtn.style.display = hasSelection ? "inline-flex" : "none";
        }

        const allApprovalBtns = document.querySelectorAll('.pdf-btn[data-type="approval"]');
        const allLabelBtns = document.querySelectorAll('.pdf-btn[data-type="label"]');

        allApprovalBtns.forEach(btn => {
            if (!btn.disabled) {
                btn.removeEventListener('click', approvalHandler);
                btn.addEventListener('click', approvalHandler);
            }
        });

        allLabelBtns.forEach(btn => {
            if (!btn.disabled) {
                btn.removeEventListener('click', labelHandler);
                btn.addEventListener('click', labelHandler);
            }
        });

        const hintDiv = document.getElementById('syncHint') || document.createElement('div');
        if (!hintDiv.id) {
            hintDiv.id = 'syncHint';
            hintDiv.style.cssText = 'background:#e8f5e9; padding:8px 15px; border-radius:20px; margin-bottom:15px; font-size:13px; color:#2e7d32; display:inline-block; width:auto;';
            const title = document.querySelector('h2');
            title.insertAdjacentElement('afterend', hintDiv);
        }

        if (hasSelection) {
            hintDiv.innerHTML = `🔗 同步模式：已從「型式認可清冊」同步 ${selectedIds.length} 筆勾選設備，目前顯示 ${displayCount} 筆 | <a href="#" id="clearSyncBtn" style="color:#c0392b;">清除同步條件</a>`;
            const clearBtn = document.getElementById('clearSyncBtn');
            if (clearBtn) {
                clearBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.removeItem('typeAccept_selected_ids');
                    renderTable();
                });
            }
        } else {
            hintDiv.innerHTML = `📋 一般模式：顯示全部 ${deviceData.length} 筆設備 | 請至「型式認可清冊」勾選設備後即可同步篩選`;
        }
    }

    function approvalHandler(e) {
        const btn = e.currentTarget;
        const idValue = btn.getAttribute('data-id');
        openApprovalPDF(idValue);
    }

    function labelHandler(e) {
        const btn = e.currentTarget;
        const idValue = btn.getAttribute('data-id');
        openLabelHTML(idValue);
    }

  async function downloadAllApprovalPDFs() {
    console.log("=== 🚀 最終測試版啟動 ===");
    const selectedIds = getSelectedIdsFromStorage();
    
    if (selectedIds.length === 0) {
        alert("目前無篩選條件，請先至「型式認可清冊」勾選設備後，再使用一鍵下載功能。");
        return;
    }

    const validDevices = deviceData.filter(item => item.id !== "-" && selectedIds.includes(item.id));
    
    if (validDevices.length === 0) {
        alert("沒有有效的識別碼 (ID)，無法下載。");
        return;
    }

    // 🔥 先告訴你，我們到底抓到了哪些資料
    let previewText = "即將下載以下檔案：\n\n";
    validDevices.forEach((item, idx) => {
        const seqNo = String(idx + 1).padStart(3, '0');
        // 強制把特殊字元跟空白全部換成底線，確保檔名絕對安全
        const safeName = String(item.deviceName || '設備').replace(/[\\/:*?"<>|\s]/g, '_');
        const safeModel = String(item.model || '型號').replace(/[\\/:*?"<>|\s]/g, '_');
        const fileName = `${seqNo}_${item.id}_${safeName}_${safeModel}.pdf`;
        
        console.log(`✅ 生成檔名:`, fileName);
        previewText += fileName + "\n";
    });

    // 彈出視窗讓你確認程式到底組出了什麼檔名
    if (!confirm(previewText + "\n確定要開始打包下載嗎？")) {
        return;
    }

    progressDiv.style.display = "block";
    progressDiv.innerHTML = `⏳ 正在準備下載...`;
    downloadBtn.disabled = true;

    try {
        const zip = new JSZip();
        let successCount = 0;
        let failCount = 0;

        // 這裡假設你已經用 Live Server 或 HTTP 環境，強制走 fetch
        for (let idx = 0; idx < validDevices.length; idx++) {
            const item = validDevices[idx];
            const pdfUrl = `PDF2/${item.id}.pdf`;
            const seqNo = String(idx + 1).padStart(3, '0');
            const safeName = String(item.deviceName || '設備').replace(/[\\/:*?"<>|\s]/g, '_');
            const safeModel = String(item.model || '型號').replace(/[\\/:*?"<>|\s]/g, '_');
            const fileName = `${seqNo}_${item.id}_${safeName}_${safeModel}.pdf`;

            try {
                console.log(`📥 抓取: ${pdfUrl}`);
                const response = await fetch(pdfUrl);
                if (response.ok) {
                    const blob = await response.blob();
                    zip.file(fileName, blob);
                    successCount++;
                    progressDiv.innerHTML = `⏳ 已下載 (${successCount}/${validDevices.length})`;
                } else {
                    console.warn(`❌ 失敗: ${pdfUrl}`);
                    failCount++;
                }
            } catch (e) {
                console.error(`❌ 錯誤:`, e);
                failCount++;
            }
        }

        if (successCount === 0) {
            alert("所有 PDF 抓取失敗！請確認 PDF2 資料夾內有檔案。");
            progressDiv.style.display = "none";
            downloadBtn.disabled = false;
            return;
        }

        progressDiv.innerHTML = `📦 正在壓縮...`;
        const content = await zip.generateAsync({ type: "blob" });
        
        const link = document.createElement('a');
        const url = URL.createObjectURL(content);
        link.href = url;
        link.download = `認可書_${selectedIds.length}筆.zip`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);

        progressDiv.innerHTML = `✅ 下載完成！`;
        setTimeout(() => { progressDiv.style.display = "none"; }, 3000);
        console.log("=== 🏁 結束 ===");

    } catch (error) {
        console.error("崩潰:", error);
        alert("打包失敗，請看 Console。");
        progressDiv.style.display = "none";
    } finally {
        downloadBtn.disabled = false;
    }
}

    downloadBtn.addEventListener('click', downloadAllApprovalPDFs);

    window.addEventListener('storage', (e) => {
        if (e.key === 'typeAccept_selected_ids') {
            console.log('🔄 偵測到勾選清單變更，重新整理表格');
            renderTable();
        }
    });

    renderTable();

    setInterval(() => {
        const currentIds = getSelectedIdsFromStorage();
        const currentIdsStr = JSON.stringify(currentIds);
        const lastIdsStr = localStorage.getItem('_last_rendered_ids') || '[]';
        if (currentIdsStr !== lastIdsStr) {
            localStorage.setItem('_last_rendered_ids', currentIdsStr);
            renderTable();
        }
    }, 500);
</script>
</body>
