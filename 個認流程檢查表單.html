<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>商品驗證工作流程檢查表單 | 多案件頁籤 | 可排序＋自動保存</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', 'Noto Sans TC', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
            background: #e9f0f5;
            margin: 0;
            padding: 32px 20px;
            color: #1a2c3e;
        }

        .checklist-container {
            max-width: 1500px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            transition: all 0.2s;
        }

        /* 頁籤樣式 */
        .tabs-container {
            background: #1e466e;
            padding: 0 20px;
            display: flex;
            gap: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .tab-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 12px 12px 0 0;
            font-family: inherit;
        }
        .tab-btn:hover {
            background: rgba(255,255,255,0.25);
        }
        .tab-btn.active {
            background: white;
            color: #1e466e;
            font-weight: 600;
        }
        /* 標題區 */
        .header {
            background: #1e466e;
            padding: 1.2rem 2rem;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 16px;
        }
        .title-section h1 {
            margin: 0;
            font-weight: 600;
            font-size: 1.8rem;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .title-section h1 small {
            font-size: 0.85rem;
            font-weight: normal;
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 40px;
        }
        .sub {
            margin-top: 8px;
            opacity: 0.85;
            font-size: 0.9rem;
        }
        .recorder-area {
            background: rgba(255,255,255,0.15);
            padding: 8px 16px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }
        .recorder-area span:first-child {
            font-weight: normal;
            opacity: 0.9;
        }
        .recorder-name {
            background: white;
            border: none;
            border-radius: 32px;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1e466e;
            width: 160px;
            outline: none;
            font-family: inherit;
        }

        /* 表格區域 */
        .table-wrapper {
            overflow-x: auto;
            padding: 0;
        }

        .workflow-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            background: white;
            min-width: 950px;
        }

        .workflow-table th {
            background: #f0f4f9;
            color: #1f3b4c;
            font-weight: 600;
            padding: 14px 12px;
            border-bottom: 2px solid #cbdde9;
            text-align: left;
            font-size: 0.95rem;
        }
        .workflow-table th:first-child { width: 40px; text-align: center; }
        .workflow-table th:nth-child(2) { width: 35%; }
        .workflow-table th:nth-child(3) { width: 10%; text-align: center; }
        .workflow-table th:nth-child(4) { width: 16%; }
        .workflow-table th:nth-child(5) { width: 25%; }

        .workflow-table td {
            padding: 12px 8px;
            border-bottom: 1px solid #e2edf2;
            vertical-align: middle;
            background-color: #ffffff;
        }
        .drag-handle {
            cursor: grab;
            text-align: center;
            font-size: 1.3rem;
            color: #819eb3;
            user-select: none;
            transition: 0.1s;
        }
        .drag-handle:active {
            cursor: grabbing;
        }
        .task-description {
            font-weight: 500;
            line-height: 1.4;
            color: #1e2f3d;
        }
        .phase-badge {
            font-weight: 700;
            background: #eef3fc;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-right: 8px;
            display: inline-block;
            white-space: nowrap;
        }
        .checkbox-cell {
            text-align: center;
        }
        .task-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #2c7da0;
            margin: 0;
        }
        .date-cell {
            min-width: 120px;
        }
        .date-input {
            border: 1px solid #cbdde6;
            border-radius: 12px;
            padding: 6px 8px;
            font-size: 0.8rem;
            background: #ffffff;
            font-family: inherit;
            width: 110px;
        }
        .remark-input {
            width: 100%;
            border: 1px solid #cbdde6;
            border-radius: 16px;
            padding: 6px 10px;
            font-size: 0.8rem;
            font-family: inherit;
            background: #fefef7;
            resize: vertical;
        }
        .date-input:focus, .remark-input:focus, .recorder-name:focus {
            outline: none;
            border-color: #2c7da0;
            box-shadow: 0 0 0 2px rgba(44,125,160,0.2);
        }

        /* 工具列 */
        .action-bar {
            padding: 18px 24px 24px 24px;
            background: #fefefe;
            border-top: 1px solid #e2edf2;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            border: none;
            background: #eef3f7;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            color: #1a4c6e;
            border: 1px solid transparent;
        }
        .btn-primary {
            background: #2c7da0;
            color: white;
        }
        .btn-primary:hover {
            background: #1f5e7a;
            transform: translateY(-1px);
        }
        .btn-outline {
            background: white;
            border: 1px solid #bbd4e3;
        }
        .btn-outline:hover {
            background: #e1f0f7;
        }
        .btn-html {
            background: #5cb85c;
            color: white;
        }
        .btn-html:hover {
            background: #449d44;
        }
        .progress-indicator {
            background: #eef2f5;
            border-radius: 60px;
            padding: 6px 18px;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .auto-save-tip {
            font-size: 0.7rem;
            color: #5f7f9a;
            background: #eef2f5;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        footer {
            background: #f8fafc;
            text-align: center;
            padding: 14px;
            font-size: 0.7rem;
            color: #7f9eb5;
            border-top: 1px solid #e2edf2;
        }
        @media (max-width: 800px) {
            .action-bar { flex-direction: column; align-items: stretch; }
            .btn-group { justify-content: center; }
            .tab-btn { padding: 8px 16px; font-size: 0.85rem; }
        }
        .dragging-row {
            opacity: 0.5;
            background: #e0f0f7;
        }
        .current-case-badge {
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-left: 10px;
        }
    </style>
    <!-- ========== 防護區塊：禁止右鍵 + 禁止 F12 開發者工具 ========== -->
    <script>
        (function() {
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });
            function blockDevTools(e) {
                if (e.key === 'F12') {
                    e.preventDefault();
                    return false;
                }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'i')) {
                    e.preventDefault();
                    return false;
                }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'J' || e.key === 'j')) {
                    e.preventDefault();
                    return false;
                }
                if ((e.ctrlKey || e.metaKey) && (e.key === 'U' || e.key === 'u')) {
                    e.preventDefault();
                    return false;
                }
                if ((e.ctrlKey || e.metaKey) && (e.key === 'S' || e.key === 's')) {
                    e.preventDefault();
                    return false;
                }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'C' || e.key === 'c')) {
                    e.preventDefault();
                    return false;
                }
                return true;
            }
            document.addEventListener('keydown', blockDevTools);
            let devtoolsOpen = false;
            const element = new Image();
            Object.defineProperty(element, 'id', {
                get: function() {
                    devtoolsOpen = true;
                    console.warn('偵測到開發者工具');
                    return '';
                }
            });
            setInterval(function() {
                devtoolsOpen = false;
                console.log(element);
                console.clear();
                if (devtoolsOpen) {
                    console.clear();
                }
            }, 1000);
        })();
    </script>
    <!-- ========== 防護區塊結束 ========== -->
	
	
</head>
<body>
<div class="checklist-container" id="appContainer">
    <!-- 頁籤區域 -->
    <div class="tabs-container" id="tabsContainer">
        <button class="tab-btn" data-case="case1">📁 案件1</button>
        <button class="tab-btn" data-case="case2">📁 案件2</button>
        <button class="tab-btn" data-case="case3">📁 案件3</button>
        <button class="tab-btn" data-case="case4">📁 案件4</button>
        <button class="tab-btn" data-case="case5">📁 案件5</button>
    </div>

    <div class="header">
        <div class="title-section">
            <h1>
                ✓ 商品驗證工作流程檢查表單
                <small>CFS / 標籤控管 / 個認函</small>
                <span class="current-case-badge" id="currentCaseBadge">案件1</span>
            </h1>
            <div class="sub">確實追蹤各階段任務進度，可排序、勾選並記錄完成日期＋備註｜自動儲存｜多案件切換</div>
        </div>
        <div class="recorder-area">
            <span>📝 記錄人員：</span>
            <input type="text" id="recorderNameInput" class="recorder-name" placeholder="請輸入姓名" value="">
        </div>
    </div>

    <div class="table-wrapper">
        <table class="workflow-table" id="workflowTable">
            <thead>
                <tr>
                    <th style="text-align:center">🟰 拖曳</th>
                    <th>項目／工作內容</th>
                    <th style="text-align:center">確認</th>
                    <th>完成日期</th>
                    <th>備註</th>
                </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
         
    </div>

    <div class="action-bar">
        <div class="btn-group">
            <button class="btn btn-outline" id="clearAllBtn">全部取消勾選</button>
            <button class="btn btn-outline" id="checkAllBtn">全部標記為完成</button>
            <button class="btn btn-primary" id="resetDateBtn">重設所有日期</button>
            <button class="btn btn-html" id="exportHtmlBtn">📄 匯出HTML (存檔用)</button>
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
            <div class="progress-indicator" id="progressInfo">
                <span>📋 完成進度</span>
                <span id="progressPercent">0%</span>
                <span id="taskCountDisplay">(0/0)</span>
            </div>
            <div class="auto-save-tip" id="autoSaveIndicator">
                💾 已自動保存
            </div>
        </div>
    </div>
    <footer>
        ✅ 上方頁籤可切換不同案件｜拖曳左側 ⋮⋮ 圖示可上下移動任務順序｜所有勾選、日期、備註、排序皆自動保存於瀏覽器
    </footer>
</div>

<script>
    // ---------- 基礎任務資料 ----------
    let tasksData = [
        { phase: "1) 前段", task: "商品所在(庫存或待進口)" },
        { phase: "1) 前段", task: "貼標時程預計(工作天內完成)" },
        { phase: "1) 前段", task: "貨品進到辦公室" },
        { phase: "1) 前段", task: "檢查構造標示,電路板等" },
        { phase: "2) 中段", task: "向 CFS 申請" },
        { phase: "2) 中段", task: "製作中文標籤(住警器以外)" },
        { phase: "2) 中段", task: "領用標籤貼紙→回傳→電子檔保存" },
        { phase: "2) 中段", task: "貼標作業" },
        { phase: "2) 中段", task: "抽樣進行(一週前約定)" },
        { phase: "2) 中段", task: "抽樣樣品寄送" },
        { phase: "2) 中段", task: "有無需要去 CFS 結線(定址式)" },
        { phase: "3) 後段", task: "收到繳費單通知(測試已經完成)" },
        { phase: "3) 後段", task: "申請電子個認函(可以出貨)" },
        { phase: "3) 後段", task: "樣品返回 HTBO→確認" },
        { phase: "3) 後段", task: "月結繳費→取得紙本個認函" }
    ];

    // 案件列表
    const CASES = ['case1', 'case2', 'case3', 'case4', 'case5'];
    let currentCase = 'case1';

    // 各案件的儲存 key 前綴
    function getStorageKey(baseKey) {
        return `${baseKey}_${currentCase}`;
    }

    // 各案件的狀態儲存
    let caseStates = {};

    // 當前案件的狀態
    let currentOrder = [];
    let checklistState = {
        checkboxStatus: {},
        dates: {},
        remarks: {}
    };

    // 初始化各案件的預設狀態
    function initCaseState() {
        for (let c of CASES) {
            if (!caseStates[c]) {
                caseStates[c] = {
                    currentOrder: tasksData.map((_, idx) => idx),
                    checkboxStatus: {},
                    dates: {},
                    remarks: {}
                };
                // 初始化 checkbox 為 false
                for (let i = 0; i < tasksData.length; i++) {
                    caseStates[c].checkboxStatus[i] = false;
                    caseStates[c].dates[i] = "";
                    caseStates[c].remarks[i] = "";
                }
            }
        }
    }

    // 儲存當前案件狀態到 caseStates 並寫入 localStorage
    function saveCurrentCaseState() {
        if (!caseStates[currentCase]) {
            caseStates[currentCase] = {
                currentOrder: [...currentOrder],
                checkboxStatus: { ...checklistState.checkboxStatus },
                dates: { ...checklistState.dates },
                remarks: { ...checklistState.remarks }
            };
        } else {
            caseStates[currentCase].currentOrder = [...currentOrder];
            caseStates[currentCase].checkboxStatus = { ...checklistState.checkboxStatus };
            caseStates[currentCase].dates = { ...checklistState.dates };
            caseStates[currentCase].remarks = { ...checklistState.remarks };
        }
        
        // 保存到 localStorage
        localStorage.setItem(`workflow_case_${currentCase}`, JSON.stringify({
            currentOrder: caseStates[currentCase].currentOrder,
            checkboxStatus: caseStates[currentCase].checkboxStatus,
            dates: caseStates[currentCase].dates,
            remarks: caseStates[currentCase].remarks
        }));
    }

    // 從 caseStates 加載當前案件狀態
    function loadCurrentCaseState() {
        if (caseStates[currentCase]) {
            currentOrder = [...caseStates[currentCase].currentOrder];
            checklistState.checkboxStatus = { ...caseStates[currentCase].checkboxStatus };
            checklistState.dates = { ...caseStates[currentCase].dates };
            checklistState.remarks = { ...caseStates[currentCase].remarks };
        } else {
            // 預設值
            currentOrder = tasksData.map((_, idx) => idx);
            checklistState.checkboxStatus = {};
            checklistState.dates = {};
            checklistState.remarks = {};
            for (let i = 0; i < tasksData.length; i++) {
                checklistState.checkboxStatus[i] = false;
                checklistState.dates[i] = "";
                checklistState.remarks[i] = "";
            }
            caseStates[currentCase] = {
                currentOrder: [...currentOrder],
                checkboxStatus: { ...checklistState.checkboxStatus },
                dates: { ...checklistState.dates },
                remarks: { ...checklistState.remarks }
            };
        }
    }

    // 從 localStorage 讀取所有案件資料
    function loadAllCasesFromStorage() {
        for (let c of CASES) {
            const saved = localStorage.getItem(`workflow_case_${c}`);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    caseStates[c] = {
                        currentOrder: parsed.currentOrder || tasksData.map((_, idx) => idx),
                        checkboxStatus: parsed.checkboxStatus || {},
                        dates: parsed.dates || {},
                        remarks: parsed.remarks || {}
                    };
                    // 補齊缺失的任務狀態
                    for (let i = 0; i < tasksData.length; i++) {
                        if (caseStates[c].checkboxStatus[i] === undefined) caseStates[c].checkboxStatus[i] = false;
                        if (caseStates[c].dates[i] === undefined) caseStates[c].dates[i] = "";
                        if (caseStates[c].remarks[i] === undefined) caseStates[c].remarks[i] = "";
                    }
                } catch(e) {}
            } else {
                // 沒有儲存資料時，建立預設
                caseStates[c] = {
                    currentOrder: tasksData.map((_, idx) => idx),
                    checkboxStatus: {},
                    dates: {},
                    remarks: {}
                };
                for (let i = 0; i < tasksData.length; i++) {
                    caseStates[c].checkboxStatus[i] = false;
                    caseStates[c].dates[i] = "";
                    caseStates[c].remarks[i] = "";
                }
            }
        }
    }

    // 保存記錄人員（依案件分開）
    function saveRecorderName() {
        const recorderInput = document.getElementById('recorderNameInput');
        if (recorderInput) {
            localStorage.setItem(`workflow_recorder_${currentCase}`, recorderInput.value);
        }
    }

    function loadRecorderName() {
        const recorderInput = document.getElementById('recorderNameInput');
        if (recorderInput) {
            const saved = localStorage.getItem(`workflow_recorder_${currentCase}`);
            recorderInput.value = saved || '';
        }
    }

    // 切換案件
    function switchToCase(caseId) {
        if (currentCase === caseId) return;
        
        // 儲存當前案件
        saveCurrentCaseState();
        saveRecorderName();
        
        // 切換案件
        currentCase = caseId;
        
        // 載入新案件狀態
        loadCurrentCaseState();
        loadRecorderName();
        
        // 更新 UI
        updateTabActive(caseId);
        document.getElementById('currentCaseBadge').innerText = caseId === 'case1' ? '案件1' : 
                                                               caseId === 'case2' ? '案件2' :
                                                               caseId === 'case3' ? '案件3' :
                                                               caseId === 'case4' ? '案件4' : '案件5';
        
        // 重新渲染表格
        renderTable();
        initDragAndDrop();
        updateProgressDisplay();
    }

    function updateTabActive(caseId) {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            if (btn.getAttribute('data-case') === caseId) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }

    // 更新進度顯示（不儲存，僅更新 UI）
    function updateProgressDisplay() {
        const total = tasksData.length;
        let checkedCount = 0;
        for (let i = 0; i < tasksData.length; i++) {
            if (checklistState.checkboxStatus[i]) checkedCount++;
        }
        const percent = total === 0 ? 0 : Math.round((checkedCount / total) * 100);
        const progressSpan = document.getElementById('progressPercent');
        const taskCountSpan = document.getElementById('taskCountDisplay');
        if (progressSpan) progressSpan.innerText = `${percent}%`;
        if (taskCountSpan) taskCountSpan.innerText = `(${checkedCount}/${total})`;
    }

    // 更新進度並儲存
    function updateProgressAndSave() {
        updateProgressDisplay();
        saveCurrentCaseState();
        
        // 自動保存提示
        const saveTip = document.getElementById('autoSaveIndicator');
        if (saveTip) {
            saveTip.innerHTML = '💾 已自動保存';
            saveTip.style.opacity = '1';
            setTimeout(() => {
                if (saveTip) saveTip.innerHTML = '💾 自動保存';
            }, 1200);
        }
    }

    // 渲染表格
    function getSortedTasks() {
        return currentOrder.map(originalIdx => ({
            originalIdx: originalIdx,
            phase: tasksData[originalIdx].phase,
            task: tasksData[originalIdx].task
        }));
    }

    let isRendering = false;

    function renderTable() {
        if (isRendering) return;
        isRendering = true;
        const tbody = document.getElementById('tableBody');
        if (!tbody) return;
        tbody.innerHTML = '';
        const sorted = getSortedTasks();
        
        sorted.forEach((item, displayIndex) => {
            const originalIdx = item.originalIdx;
            const tr = document.createElement('tr');
            tr.setAttribute('data-original-idx', originalIdx);
            tr.setAttribute('data-display-order', displayIndex);
            tr.style.cursor = 'default';
            
            const tdDrag = document.createElement('td');
            tdDrag.className = 'drag-handle';
            tdDrag.innerHTML = '☰⋮';
            tdDrag.style.cursor = 'grab';
            tdDrag.setAttribute('aria-label', '拖曳排序');
            tdDrag.title = '按住上下拖曳移動順序';
            
            const tdTask = document.createElement('td');
            tdTask.className = 'task-description';
            const phaseLabel = `<span class="phase-badge">${escapeHtml(item.phase)}</span>`;
            tdTask.innerHTML = `${phaseLabel} ${escapeHtml(item.task)}`;
            
            const tdCheck = document.createElement('td');
            tdCheck.className = 'checkbox-cell';
            tdCheck.style.textAlign = 'center';
            const isChecked = checklistState.checkboxStatus[originalIdx] || false;
            const checkboxHtml = `<input type="checkbox" class="task-checkbox" data-idx="${originalIdx}" ${isChecked ? 'checked' : ''}>`;
            tdCheck.innerHTML = checkboxHtml;
            
            const tdDate = document.createElement('td');
            tdDate.className = 'date-cell';
            const dateValue = checklistState.dates[originalIdx] || '';
            const dateHtml = `<input type="date" class="date-input" data-date-idx="${originalIdx}" value="${dateValue}">`;
            tdDate.innerHTML = dateHtml;
            
            const tdRemark = document.createElement('td');
            tdRemark.className = 'remark-cell';
            const remarkValue = checklistState.remarks[originalIdx] || '';
            const remarkHtml = `<textarea rows="1" class="remark-input" data-remark-idx="${originalIdx}" placeholder="輸入備註 ..." style="min-height: 38px;">${escapeHtml(remarkValue)}</textarea>`;
            tdRemark.innerHTML = remarkHtml;
            
            tr.appendChild(tdDrag);
            tr.appendChild(tdTask);
            tr.appendChild(tdCheck);
            tr.appendChild(tdDate);
            tr.appendChild(tdRemark);
            tbody.appendChild(tr);
        });
        
        attachEventListeners();
        updateProgressAndSave();
        isRendering = false;
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function attachEventListeners() {
        document.querySelectorAll('.task-checkbox').forEach(cb => {
            cb.removeEventListener('change', handleCheckChange);
            cb.addEventListener('change', handleCheckChange);
        });
        document.querySelectorAll('.date-input').forEach(inp => {
            inp.removeEventListener('change', handleDateChange);
            inp.addEventListener('change', handleDateChange);
        });
        document.querySelectorAll('.remark-input').forEach(ta => {
            ta.removeEventListener('input', handleRemarkInput);
            ta.addEventListener('input', handleRemarkInput);
        });
    }
    
    function handleCheckChange(e) {
        const cb = e.target;
        const idxAttr = cb.getAttribute('data-idx');
        if (idxAttr !== null) {
            const originalIdx = parseInt(idxAttr, 10);
            if (!isNaN(originalIdx)) {
                checklistState.checkboxStatus[originalIdx] = cb.checked;
                updateProgressAndSave();
            }
        }
    }
    
    function handleDateChange(e) {
        const input = e.target;
        const idxAttr = input.getAttribute('data-date-idx');
        if (idxAttr !== null) {
            const originalIdx = parseInt(idxAttr, 10);
            if (!isNaN(originalIdx)) {
                checklistState.dates[originalIdx] = input.value;
                updateProgressAndSave();
            }
        }
    }
    
    function handleRemarkInput(e) {
        const textarea = e.target;
        const idxAttr = textarea.getAttribute('data-remark-idx');
        if (idxAttr !== null) {
            const originalIdx = parseInt(idxAttr, 10);
            if (!isNaN(originalIdx)) {
                checklistState.remarks[originalIdx] = textarea.value;
                updateProgressAndSave();
            }
        }
    }
    
    // 拖曳排序
    let dragSrcIndex = null;
    
    function initDragAndDrop() {
        const tbody = document.getElementById('tableBody');
        if (!tbody) return;
        
        tbody.removeEventListener('dragstart', handleDragStart);
        tbody.removeEventListener('dragover', handleDragOver);
        tbody.removeEventListener('drop', handleDrop);
        tbody.removeEventListener('dragend', handleDragEnd);
        
        tbody.addEventListener('dragstart', handleDragStart);
        tbody.addEventListener('dragover', handleDragOver);
        tbody.addEventListener('drop', handleDrop);
        tbody.addEventListener('dragend', handleDragEnd);
        
        const rows = tbody.querySelectorAll('tr');
        rows.forEach(row => {
            row.setAttribute('draggable', 'true');
            row.style.userSelect = 'none';
            const handle = row.querySelector('.drag-handle');
            if (handle) {
                handle.addEventListener('dragstart', (e) => { e.stopPropagation(); });
            }
            row.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', row.getAttribute('data-original-idx'));
                e.dataTransfer.effectAllowed = 'move';
            });
        });
    }
    
    function handleDragStart(e) {
        const row = e.target.closest('tr');
        if (!row) return;
        const originalIdx = row.getAttribute('data-original-idx');
        if (originalIdx === null) return;
        dragSrcIndex = parseInt(originalIdx, 10);
        e.dataTransfer.setData('text/plain', dragSrcIndex);
        e.dataTransfer.effectAllowed = 'move';
        row.classList.add('dragging-row');
    }
    
    function handleDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
    }
    
    function handleDrop(e) {
        e.preventDefault();
        const targetRow = e.target.closest('tr');
        if (!targetRow) return;
        const targetOriginalIdxAttr = targetRow.getAttribute('data-original-idx');
        if (targetOriginalIdxAttr === null) return;
        const targetIdx = parseInt(targetOriginalIdxAttr, 10);
        if (dragSrcIndex === undefined || dragSrcIndex === null) return;
        if (dragSrcIndex === targetIdx) return;
        
        const srcPos = currentOrder.findIndex(idx => idx === dragSrcIndex);
        const targetPos = currentOrder.findIndex(idx => idx === targetIdx);
        if (srcPos !== -1 && targetPos !== -1) {
            const [moved] = currentOrder.splice(srcPos, 1);
            currentOrder.splice(targetPos, 0, moved);
            renderTable();
            updateProgressAndSave();
            setTimeout(() => { initDragAndDrop(); }, 50);
        }
        dragSrcIndex = null;
        document.querySelectorAll('.dragging-row').forEach(r => r.classList.remove('dragging-row'));
    }
    
    function handleDragEnd(e) {
        document.querySelectorAll('.dragging-row').forEach(r => r.classList.remove('dragging-row'));
        dragSrcIndex = null;
    }
    
    // 按鈕功能
    function checkAll() {
        for (let i = 0; i < tasksData.length; i++) {
            checklistState.checkboxStatus[i] = true;
        }
        renderTable();
        updateProgressAndSave();
        setTimeout(() => initDragAndDrop(), 50);
    }
    
    function clearAll() {
        for (let i = 0; i < tasksData.length; i++) {
            checklistState.checkboxStatus[i] = false;
        }
        renderTable();
        updateProgressAndSave();
        setTimeout(() => initDragAndDrop(), 50);
    }
    
    function resetAllDates() {
        for (let i = 0; i < tasksData.length; i++) {
            checklistState.dates[i] = "";
        }
        renderTable();
        updateProgressAndSave();
        setTimeout(() => initDragAndDrop(), 50);
    }
    
    // 匯出 HTML
    function exportAsHtml() {
        const styleContent = document.querySelector('style').innerHTML;
        const title = document.querySelector('title').innerHTML;
        const recorderValue = document.getElementById('recorderNameInput')?.value || '';
        const currentCaseName = currentCase === 'case1' ? '案件1' : currentCase === 'case2' ? '案件2' : currentCase === 'case3' ? '案件3' : currentCase === 'case4' ? '案件4' : '案件5';
        
        const currentTableHTML = document.getElementById('workflowTable').cloneNode(true);
        
        currentTableHTML.querySelectorAll('th:first-child, td:first-child').forEach(cell => {
            cell.remove();
        });
        
        currentTableHTML.querySelectorAll('.task-checkbox').forEach(cb => {
            const td = cb.closest('td');
            const isChecked = cb.checked;
            const span = document.createElement('span');
            span.style.fontSize = '1rem';
            span.style.fontWeight = '500';
            span.style.color = isChecked ? '#2c7da0' : '#aaa';
            span.innerHTML = isChecked ? '✅ 已完成' : '◻️ 未完成';
            td.innerHTML = '';
            td.appendChild(span);
            td.style.textAlign = 'center';
        });
        
        currentTableHTML.querySelectorAll('.date-input').forEach(dateInput => {
            const td = dateInput.closest('td');
            const dateValue = dateInput.value;
            td.innerHTML = dateValue ? dateValue : '—';
            td.style.padding = '12px 8px';
        });
        
        currentTableHTML.querySelectorAll('.remark-input').forEach(remark => {
            const td = remark.closest('td');
            const remarkText = remark.value.trim();
            td.innerHTML = remarkText ? `<span style="white-space:pre-wrap;">${escapeHtml(remarkText)}</span>` : '<span style="color:#999;">—</span>';
        });
        
        const serializedDoc = `<!DOCTYPE html>
        <html lang="zh-TW">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>${title} - ${currentCaseName} 靜態存檔版本</title>
            <style>
                ${styleContent}
                .action-bar, .btn-group, .btn, .auto-save-tip, .drag-handle,
                #exportHtmlBtn, .btn-html, .btn-outline, .btn-primary, .tabs-container {
                    display: none !important;
                }
                .task-checkbox, .date-input, .remark-input {
                    pointer-events: none;
                }
                body {
                    background: white;
                    padding: 20px;
                    margin: 0;
                }
                .checklist-container {
                    box-shadow: none;
                }
            </style>
        </head>
        <body>
            <div class="checklist-container">
                <div class="header">
                    <div class="title-section">
                        <h1>✓ 商品驗證工作流程檢查表單 <small>CFS / 標籤控管 / 個認函</small></h1>
                        <div class="sub">存檔版本 - ${currentCaseName} - ${new Date().toLocaleString()}</div>
                    </div>
                    <div class="recorder-area">
                        <span>📝 記錄人員：</span>
                        <span style="background:white; color:#1e466e; padding:4px 16px; border-radius:40px;">${escapeHtml(recorderValue)}</span>
                    </div>
                </div>
                <div class="table-wrapper">
                    ${currentTableHTML.outerHTML}
                </div>
                <footer style="text-align:center; padding:16px; color:#888;">
                    此為系統匯出之靜態存檔，資料時間：${new Date().toLocaleString()}
                </footer>
            </div>
        </body>
        </html>`;
        
        const blob = new Blob([serializedDoc], { type: 'text/html' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.download = `商品驗證工作流程_${currentCaseName}_存檔_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.html`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }
    
    // 初始化
    function init() {
        loadAllCasesFromStorage();
        loadCurrentCaseState();
        loadRecorderName();
        renderTable();
        initDragAndDrop();
        
        // 綁定頁籤事件
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const caseId = btn.getAttribute('data-case');
                switchToCase(caseId);
            });
        });
        
        // 設定當前頁籤高亮
        updateTabActive(currentCase);
        document.getElementById('currentCaseBadge').innerText = currentCase === 'case1' ? '案件1' : 
                                                               currentCase === 'case2' ? '案件2' :
                                                               currentCase === 'case3' ? '案件3' :
                                                               currentCase === 'case4' ? '案件4' : '案件5';
        
        // 綁定按鈕
        document.getElementById('checkAllBtn')?.addEventListener('click', () => { checkAll(); });
        document.getElementById('clearAllBtn')?.addEventListener('click', () => { clearAll(); });
        document.getElementById('resetDateBtn')?.addEventListener('click', () => { resetAllDates(); });
        document.getElementById('exportHtmlBtn')?.addEventListener('click', () => { exportAsHtml(); });
        
        // 記錄人員變更時儲存
        const recorderInput = document.getElementById('recorderNameInput');
        if (recorderInput) {
            recorderInput.addEventListener('input', () => {
                saveRecorderName();
            });
        }
        
        // 拖曳重新綁定
        const observer = new MutationObserver(() => { initDragAndDrop(); });
        observer.observe(document.getElementById('tableBody'), { childList: true, subtree: false });
    }
    
    init();
</script>
</body>
</html>
