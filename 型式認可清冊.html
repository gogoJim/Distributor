    <!-- ========== 防護區塊：禁止右鍵 + 禁止 F12 開發者工具 ========== -->
    <script>
        (function() {
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });
            function blockDevTools(e) {
                if (e.key === 'F12') {
                    e.preventDefault();
                    return false;
                }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'i')) {
                    e.preventDefault();
                    return false;
                }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'J' || e.key === 'j')) {
                    e.preventDefault();
                    return false;
                }
                if ((e.ctrlKey || e.metaKey) && (e.key === 'U' || e.key === 'u')) {
                    e.preventDefault();
                    return false;
                }
                if ((e.ctrlKey || e.metaKey) && (e.key === 'S' || e.key === 's')) {
                    e.preventDefault();
                    return false;
                }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'C' || e.key === 'c')) {
                    e.preventDefault();
                    return false;
                }
                return true;
            }
            document.addEventListener('keydown', blockDevTools);
            let devtoolsOpen = false;
            const element = new Image();
            Object.defineProperty(element, 'id', {
                get: function() {
                    devtoolsOpen = true;
                    console.warn('偵測到開發者工具');
                    return '';
                }
            });
            setInterval(function() {
                devtoolsOpen = false;
                console.log(element);
                console.clear();
                if (devtoolsOpen) {
                    console.clear();
                }
            }, 1000);
        })();
    </script>

function saveSelectedToLocalStorage() {
    const selectedItems = [];
    const selectedIds = [];  // 新增：儲存勾選設備的 ID (從 id.txt 比對而來)
    
    for (let i = 0; i < checkedStatus.length; i++) {
        if (checkedStatus[i] === true) {
            const item = rawData[i];
            selectedItems.push({
                deviceName: item.deviceName,
                model: item.model,
                certNo: item.certNo
            });
            
            // 根據型號找出對應的 ID (需要從 id.txt 的對照表取得)
            const matchedId = findIdByModel(item.model);
            if (matchedId) {
                selectedIds.push(matchedId);
            }
        }
    }
    
    // 儲存完整資料 (供申請書使用)
    localStorage.setItem('typeAccept_selected_export', JSON.stringify(selectedItems));
    // 儲存 ID 清單 (供型認書資料庫同步)
    localStorage.setItem('typeAccept_selected_ids', JSON.stringify(selectedIds));
    
    console.log('✅ 已儲存勾選設備至 localStorage，共', selectedItems.length, '筆，ID清單:', selectedIds);

    // 從 localStorage 恢復勾選狀態 (頁面重啟時)
    function loadCheckedStatusFromStorage() {
        const stored = localStorage.getItem('typeAccept_selected_export');
        if (stored) {
            try {
                const savedItems = JSON.parse(stored);
                if (Array.isArray(savedItems) && savedItems.length > 0) {
                    // 重置勾選狀態
                    checkedStatus.fill(false);
                    // 根據儲存的 deviceName + model + certNo 比對恢復勾選
                    for (let i = 0; i < rawData.length; i++) {
                        const item = rawData[i];
                        const found = savedItems.some(saved => 
                            saved.deviceName === item.deviceName && 
                            saved.model === item.model && 
                            saved.certNo === item.certNo
                        );
                        if (found) checkedStatus[i] = true;
                    }
                    console.log('🔄 已從 localStorage 恢復勾選狀態，共', savedItems.length, '筆');
                }
            } catch(e) { console.warn('恢復勾選狀態失敗', e); }
        }
    }

    function updateSelectedCount() {
        const totalChecked = checkedStatus.filter(v => v === true).length;
        selectedCountSpan.innerText = `已選取 ${totalChecked} 筆`;
        return totalChecked;
    }

    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    function renderTable() {
        let indicesToShow = [];
        if (selectedModeActive) {
            indicesToShow = rawData.map((_, idx) => idx).filter(idx => checkedStatus[idx] === true);
        } else {
            if (isFilterMode && lastSearchTerm.trim() !== "") {
                indicesToShow = [...currentFilteredIndices];
            } else {
                indicesToShow = rawData.map((_, idx) => idx);
            }
        }
        
        if (indicesToShow.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px;">⚠️ 目前無符合條件的資料，請調整搜尋或「選定」條件</td></tr>`;
            updateSelectedCount();
            return;
        }

        let html = "";
        for (let i = 0; i < indicesToShow.length; i++) {
            const originalIdx = indicesToShow[i];
            const item = rawData[originalIdx];
            const isChecked = checkedStatus[originalIdx] ? "checked" : "";
            html += `<tr data-original-index="${originalIdx}">
                        <td class="checkbox-col"><input type="checkbox" class="row-checkbox" data-idx="${originalIdx}" ${isChecked}></td>
                        <td style="text-align:center;">${item.sn}</td>
                        <td>${escapeHtml(item.certNo)}</td>
                        <td>${escapeHtml(item.deviceName)}</td>
                        <td>${escapeHtml(item.manufacturer)}</td>
                        <td>${escapeHtml(item.model)}</td>
                      </tr>`;
        }
        tbody.innerHTML = html;
        
        // 綁定 checkbox 事件 (每次勾選變更時自動儲存)
        document.querySelectorAll('.row-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', (e) => {
                const idx = parseInt(e.target.getAttribute('data-idx'));
                if (!isNaN(idx)) {
                    checkedStatus[idx] = e.target.checked;
                    updateSelectedCount();
                    saveSelectedToLocalStorage();  // 每次勾選變更自動儲存
                    if (selectedModeActive) {
                        renderTable();
                    }
                }
            });
        });
        updateSelectedCount();
    }

    function applySearchFilter() {
        const keyword = searchInput.value.trim().toLowerCase();
        lastSearchTerm = keyword;
        if (keyword === "") {
            isFilterMode = false;
            currentFilteredIndices = [];
        } else {
            isFilterMode = true;
            const filtered = [];
            for (let i = 0; i < rawData.length; i++) {
                const item = rawData[i];
                const combined = `${item.certNo} ${item.deviceName} ${item.manufacturer} ${item.model} ${item.sn}`.toLowerCase();
                if (combined.includes(keyword)) {
                    filtered.push(i);
                }
            }
            currentFilteredIndices = filtered;
        }
        if (selectedModeActive) {
            selectedModeActive = false;
        }
        renderTable();
    }

    function resetTable() {
        searchInput.value = "";
        isFilterMode = false;
        selectedModeActive = false;
        lastSearchTerm = "";
        currentFilteredIndices = [];
        renderTable();
    }

    function showSelectedOnly() {
        const hasChecked = checkedStatus.some(v => v === true);
        if (!hasChecked) {
            alert("目前尚未勾選任何項目，請先勾選列後再點「選定」");
            return;
        }
        selectedModeActive = true;
        renderTable();
        const checkedCount = saveSelectedToLocalStorage();
        alert(`✅ 已選定 ${checkedCount} 筆設備！\n\n可至「預領認可標示申請書」點擊「從型式認可清冊匯入勾選設備」按鈕。`);
    }

    function clearAllChecks() {
        checkedStatus.fill(false);
        saveSelectedToLocalStorage();  // 清除後也儲存空陣列
        if (selectedModeActive) {
            selectedModeActive = false;
            isFilterMode = false;
            searchInput.value = "";
            lastSearchTerm = "";
        }
        renderTable();
    }

    // 事件綁定
    searchBtn.addEventListener('click', applySearchFilter);
    resetSearchBtn.addEventListener('click', resetTable);
    showSelectedBtn.addEventListener('click', showSelectedOnly);
    clearAllCheckedBtn.addEventListener('click', clearAllChecks);
    searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') applySearchFilter(); });

    // 初始化：先從 localStorage 恢復勾選狀態，再渲染表格
    loadCheckedStatusFromStorage();
    renderTable();
    updateSelectedCount();
</script>
